<div class="marge-form-container">
  @for (marge of margesList; track marge.anneesMarge) {
    <div
      class="marge-choice"
      (click)="selectMarge(marge)"
      [ngClass]="{
        'not-chosen': value() && value() !== marge,
      }"
    >
      <span>{{ marge.points }}</span>
    </div>
  }
</div>
